name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild & Start Application via Docker Compose
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting AI Video Editor deployment..."

          # 1. Discover Docker paths
          $searchPaths = @(
              "C:\Program Files\Docker",
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\ProgramData\DockerDesktop\version-cli"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Ensure docker-compose.exe exists on Windows Server
          if (-not (Get-Command docker-compose -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files\Docker\docker-compose.exe")) {
              Write-Host "Downloading docker-compose standalone binary for Windows Server..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              if (-not (Test-Path "C:\Program Files\Docker")) {
                  New-Item -ItemType Directory -Path "C:\Program Files\Docker" -Force
              }
              Invoke-WebRequest -Uri "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-windows-x86_64.exe" -OutFile "C:\Program Files\Docker\docker-compose.exe"
          }

          # Add docker folder to PATH
          if (Test-Path "C:\Program Files\Docker") {
              $env:Path += ";C:\Program Files\Docker"
          }

          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Run docker-compose up -d --build
          $env:DOCKER_DEFAULT_PLATFORM = "linux"
          Write-Host "Launching Docker Compose build..."
          if (Test-Path "C:\Program Files\Docker\docker-compose.exe") {
              & "C:\Program Files\Docker\docker-compose.exe" --env-file .env.production up -d --build
          } else {
              docker-compose --env-file .env.production up -d --build
          }

          Write-Host "Deployment Completed Successfully!"
