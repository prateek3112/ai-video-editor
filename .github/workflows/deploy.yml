name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Self-Healing Update & Rebuild Docker Containers
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "🚀 Starting AI Video Editor deployment on self-hosted runner..."

          # 1. Discover and add Git & Docker to PATH dynamically
          $searchPaths = @(
              "C:\Program Files\Git\cmd",
              "C:\Program Files\Git\bin",
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\Program Files\Docker\Docker\resources",
              "C:\Program Files\Docker\Docker\resources\cli-plugins",
              "C:\ProgramData\DockerDesktop\version-cli"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Locate git.exe if not in PATH
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              $gitExe = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "git.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($gitExe) {
                  $env:Path = "$($gitExe.DirectoryName);$env:Path"
              }
          }

          # 3. Clean clone or update C:\ai-video-editor
          $targetDir = "C:\ai-video-editor"
          if (Test-Path $targetDir) {
              Set-Location -Path $targetDir
              try {
                  git fetch --all
                  git reset --hard
                  git checkout -B master origin/master
                  git pull origin master
              } catch {
                  Write-Host "⚠️ Git update failed, performing clean clone..."
                  Set-Location -Path "C:\"
                  Remove-Item -Path $targetDir -Recurse -Force -ErrorAction SilentlyContinue
                  git clone https://github.com/prateek3112/ai-video-editor.git $targetDir
                  Set-Location -Path $targetDir
              }
          } else {
              Set-Location -Path "C:\"
              git clone https://github.com/prateek3112/ai-video-editor.git $targetDir
              Set-Location -Path $targetDir
          }

          # 4. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=`"YOUR_KEY`"`n"
              }
          }

          # 5. Discover docker or docker-compose
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
              $dockerExe = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "docker.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dockerExe) {
                  $env:Path = "$($dockerExe.DirectoryName);$env:Path"
              }
          }

          if (Get-Command docker-compose -ErrorAction SilentlyContinue) {
              docker-compose --env-file .env.production up -d --build
          } elseif (Get-Command docker -ErrorAction SilentlyContinue) {
              docker compose --env-file .env.production up -d --build
          } else {
              Write-Host "⚠️ Docker binary not found in PATH. Please install Docker Desktop or Docker Engine on Windows VM."
          }

          Write-Host "✅ Deployment Pipeline Execution Finished!"
