name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update & Rebuild Docker Containers
        shell: powershell
        run: |
          Write-Host "🚀 Updating AI Video Editor build..."
          if (-not (Test-Path "C:\ai-video-editor")) {
            cd C:\
            git clone https://github.com/prateek3112/ai-video-editor.git
          }
          cd C:\ai-video-editor
          git pull origin master
          if (-not (Test-Path ".env.production")) {
            Copy-Item .env.production.example .env.production
          }
          docker-compose --env-file .env.production up -d --build
          Write-Host "✅ Deployment Complete!"
