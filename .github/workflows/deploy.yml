# Live Deployment Workflow for Self-Hosted Windows Server Runner
name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Stop Running Service Before Checkout
        shell: powershell
        run: |
          Write-Host "Stopping any running service to release Windows file locks..."
          Stop-ScheduledTask -TaskName "AIVideoEditor247" -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName "AIVideoEditor247" -Confirm:$false -ErrorAction SilentlyContinue
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Deploy Native Node.js Application on Windows Server
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting 24/7 AI Video Editor deployment..."

          # 1. Discover Node.js & Git paths
          $searchPaths = @(
              "C:\Program Files\nodejs",
              "C:\Program Files\Git\cmd",
              "$env:APPDATA\npm"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Open Firewall Ports 8000, 9999 & 3000
          New-NetFirewallRule -DisplayName "AI-Video-Editor-8000" -Direction Inbound -LocalPort 8000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "AI-Video-Editor-9999" -Direction Inbound -LocalPort 9999 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "AI-Video-Editor-3000" -Direction Inbound -LocalPort 3000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

          # Reset netsh portproxy so Node binds directly to 0.0.0.0:3000
          netsh interface portproxy reset

          # Stop any existing process occupying port 3000 or 9999
          $stalePorts = @(3000, 9999)
          foreach ($p in $stalePorts) {
              $pids = Get-NetTCPConnection -LocalPort $p -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique
              foreach ($procId in $pids) {
                  Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
              }
          }
          
          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Auto-install Node.js v20 if missing
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Node.js v20 on Windows Server..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $nodeMsi = "$env:TEMP\node-v20.13.1-x64.msi"
              Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.13.1/node-v20.13.1-x64.msi" -OutFile $nodeMsi
              Start-Process msiexec.exe -ArgumentList "/i", "`"$nodeMsi`"", "/quiet", "/norestart" -Wait
              $env:Path += ";C:\Program Files\nodejs"
          }

          # 5. Install dependencies & build Next.js
          Write-Host "Installing npm packages..."
          npm install --legacy-peer-deps

          Write-Host "Building production Next.js bundle..."
          npm run build

          # 6. Deploy to dedicated live directory C:\ai-video-editor-live (decoupled from runner workspace)
          $liveDir = "C:\ai-video-editor-live"
          Write-Host "Syncing build artifacts to $liveDir..."
          if (-not (Test-Path $liveDir)) {
              New-Item -ItemType Directory -Path $liveDir -Force | Out-Null
          }

          # Copy standalone build
          if (Test-Path ".next\standalone") {
              Copy-Item -Path ".next\standalone\*" -Destination $liveDir -Recurse -Force
          }
          
          # Copy public static files
          if (Test-Path "public") {
              New-Item -ItemType Directory -Path "$liveDir\public" -Force -ErrorAction SilentlyContinue | Out-Null
              Copy-Item -Path "public\*" -Destination "$liveDir\public" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Copy .next/static
          if (Test-Path ".next\static") {
              New-Item -ItemType Directory -Path "$liveDir\.next\static" -Force -ErrorAction SilentlyContinue | Out-Null
              Copy-Item -Path ".next\static\*" -Destination "$liveDir\.next\static" -Recurse -Force -ErrorAction SilentlyContinue
          }

          # 7. Register & Start Permanent 24/7 Windows Service from C:\ai-video-editor-live
          Write-Host "Registering permanent 24/7 Windows Service..."
          
          $nodeCmd = Get-Command node.exe -ErrorAction SilentlyContinue
          $nodeExe = if ($nodeCmd) { $nodeCmd.Source } else { Join-Path $env:SystemDrive "Program Files\nodejs\node.exe" }

          # Create launcher batch script using standalone server.js on Port 3000
          $runnerBat = Join-Path $liveDir "run-247-server.bat"
          $batContent = "@echo off`r`ncd /d `"$liveDir`"`r`nset PORT=3000`r`nset HOSTNAME=0.0.0.0`r`nset NODE_ENV=production`r`n`"$nodeExe`" server.js > C:\ai-video-editor-247.log 2>&1"
          Set-Content -Path $runnerBat -Value $batContent

          # Register Scheduled Task with Infinite Time Limit running under SYSTEM
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c `"$runnerBat`"" -WorkingDirectory $liveDir
          $trigger = New-ScheduledTaskTrigger -AtStartup
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Days 9999) -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1)

          Register-ScheduledTask -TaskName "AIVideoEditor247" -Action $action -Trigger $trigger -User "NT AUTHORITY\SYSTEM" -RunLevel Highest -Settings $settings -Force
          Start-ScheduledTask -TaskName "AIVideoEditor247"

          Start-Sleep -Seconds 6

          Write-Host "=== EMPIRICAL DIAGNOSTIC AUDIT ==="
          Write-Host "--- Task Scheduler Status ---"
          Get-ScheduledTask -TaskName "AIVideoEditor247" -ErrorAction SilentlyContinue | Format-List
          Get-ScheduledTaskInfo -TaskName "AIVideoEditor247" -ErrorAction SilentlyContinue | Format-List

          Write-Host "--- Active Node Processes ---"
          Get-Process -Name node -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, CPU, WorkingSet

          Write-Host "--- Active Port Bindings (3000) ---"
          Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort, State, OwningProcess

          Write-Host "--- Server Log Output (C:\ai-video-editor-247.log) ---"
          if (Test-Path "C:\ai-video-editor-247.log") {
              Get-Content "C:\ai-video-editor-247.log" -Tail 50
          } else {
              Write-Host "Log file C:\ai-video-editor-247.log does not exist."
          }

          Write-Host "--- Local Health Check ---"
          try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:3000" -UseBasicParsing -TimeoutSec 10
              Write-Host "Health Check: HTTP $($response.StatusCode)"
          } catch {
              Write-Host "Health Check Warning: $($_.Exception.Message)"
          }

          Write-Host "Deployment Audit Completed!"
