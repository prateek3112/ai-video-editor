# Live Deployment Workflow for Self-Hosted Windows Server Runner
name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Native Node.js Application on Windows Server
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting AI Video Editor deployment..."

          # 1. Discover Node.js & Git paths
          $searchPaths = @(
              "C:\Program Files\nodejs",
              "C:\Program Files\Git\cmd"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Ensure Windows Firewall ports 3000 & 8000 are open
          New-NetFirewallRule -DisplayName "AI-Video-Editor-3000" -Direction Inbound -LocalPort 3000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "AI-Video-Editor-8000" -Direction Inbound -LocalPort 8000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Auto-install Node.js v20 if missing
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Node.js v20 on Windows Server..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $nodeMsi = "$env:TEMP\node-v20.13.1-x64.msi"
              Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.13.1/node-v20.13.1-x64.msi" -OutFile $nodeMsi
              Start-Process msiexec.exe -ArgumentList "/i", "`"$nodeMsi`"", "/quiet", "/norestart" -Wait
              $env:Path += ";C:\Program Files\nodejs"
          }

          # 5. Install dependencies & build Next.js
          Write-Host "Installing npm packages..."
          npm install --legacy-peer-deps

          Write-Host "Building production Next.js bundle..."
          npm run build

          # Copy static files to standalone directory for Next.js standalone server
          if (Test-Path ".next\standalone") {
              if (Test-Path "public") {
                  Copy-Item -Path "public" -Destination ".next\standalone\public" -Recurse -Force -ErrorAction SilentlyContinue
              }
              if (Test-Path ".next\static") {
                  New-Item -ItemType Directory -Path ".next\standalone\.next\static" -Force -ErrorAction SilentlyContinue
                  Copy-Item -Path ".next\static\*" -Destination ".next\standalone\.next\static" -Recurse -Force -ErrorAction SilentlyContinue
              }
          }

          # 6. Install PM2 for robust background process management
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
              Write-Host "Installing PM2 process manager..."
              npm install -g pm2
          }

          # 7. Start Standalone Next.js Server bound to 0.0.0.0 (All IP Interfaces) on Port 3000 and 8000
          Write-Host "Launching production Next.js server bound to 0.0.0.0:3000..."
          
          # Delete previous PM2 instances
          pm2 delete ai-video-editor -s -ErrorAction SilentlyContinue

          # Set environment for 0.0.0.0 binding
          $env:HOSTNAME = "0.0.0.0"
          $env:PORT = "3000"
          $env:NODE_ENV = "production"

          if (Test-Path ".next\standalone\server.js") {
              pm2 start ".next\standalone\server.js" --name "ai-video-editor" --update-env
          } else {
              pm2 start npm --name "ai-video-editor" -- start -- -H 0.0.0.0 -p 3000
          }

          pm2 save -s

          Write-Host "Deployment Completed Successfully! Server active on http://0.0.0.0:3000 (Accessible via Public IP)"
