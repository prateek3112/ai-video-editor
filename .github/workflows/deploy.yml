name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild & Start Application
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "🚀 Starting AI Video Editor deployment in workspace..."

          # Discover Docker paths dynamically
          $searchPaths = @(
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\Program Files\Docker\Docker\resources",
              "C:\Program Files\Docker\Docker",
              "C:\Program Files\Docker\Docker\resources\cli-plugins",
              "C:\ProgramData\DockerDesktop\version-cli"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
              $dockerExe = Get-ChildItem -Path "C:\Program Files", "C:\ProgramData" -Filter "docker.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dockerExe) {
                  $env:Path = "$($dockerExe.DirectoryName);$env:Path"
              }
          }

          # Ensure .env.production exists in workspace
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=`"YOUR_KEY`"`n"
              }
          }

          # Run Docker Compose
          if (Get-Command docker-compose -ErrorAction SilentlyContinue) {
              docker-compose --env-file .env.production up -d --build
              Write-Host "✅ Docker Compose build completed!"
          } elseif (Get-Command docker -ErrorAction SilentlyContinue) {
              docker compose --env-file .env.production up -d --build
              Write-Host "✅ Docker Compose build completed!"
          } else {
              Write-Error "⚠️ Docker is not installed on this Windows VM. Please install Docker Desktop or Docker Engine."
              exit 1
          }
