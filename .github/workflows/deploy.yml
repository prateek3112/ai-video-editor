name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update & Rebuild Docker Containers
        shell: powershell
        run: |
          Write-Host "🚀 Updating AI Video Editor build..."
          
          # Add Git and Docker paths to environment
          $paths = @(
              "C:\Program Files\Git\cmd",
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\Program Files\Docker\Docker\resources"
          )
          foreach ($p in $paths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path += ";$p"
              }
          }

          if (-not (Test-Path "C:\ai-video-editor")) {
              cd C:\
              git clone https://github.com/prateek3112/ai-video-editor.git
          }
          
          cd C:\ai-video-editor
          git fetch origin master
          git reset --hard origin/master
          git pull origin master
          
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=`"YOUR_KEY`"`n"
              }
          }

          if (Get-Command docker-compose -ErrorAction SilentlyContinue) {
              docker-compose --env-file .env.production up -d --build
          } else {
              docker compose --env-file .env.production up -d --build
          }
          
          Write-Host "✅ Deployment Complete!"
