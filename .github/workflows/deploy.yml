# Live Deployment Workflow for Self-Hosted Windows Server Runner
name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Native Node.js Application on Windows Server
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting AI Video Editor deployment..."

          # 1. Discover Node.js & Git paths
          $searchPaths = @(
              "C:\Program Files\nodejs",
              "C:\Program Files\Git\cmd",
              "$env:APPDATA\npm"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Ensure Windows Firewall ports & netsh portproxy bridge are configured
          New-NetFirewallRule -DisplayName "AI-Video-Editor-3000" -Direction Inbound -LocalPort 3000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "AI-Video-Editor-8000" -Direction Inbound -LocalPort 8000 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "AI-Video-Editor-9999" -Direction Inbound -LocalPort 9999 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue

          # Clear existing portproxy rules & set up clean kernel forwarding from 9999/8000 to local port 3000
          netsh interface portproxy reset
          netsh interface portproxy add v4tov4 listenport=9999 listenaddress=0.0.0.0 connectport=3000 connectaddress=127.0.0.1
          netsh interface portproxy add v4tov4 listenport=8000 listenaddress=0.0.0.0 connectport=3000 connectaddress=127.0.0.1
          netsh interface portproxy add v4tov4 listenport=3000 listenaddress=0.0.0.0 connectport=3000 connectaddress=127.0.0.1

          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Auto-install Node.js v20 if missing
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
              Write-Host "Installing Node.js v20 on Windows Server..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $nodeMsi = "$env:TEMP\node-v20.13.1-x64.msi"
              Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.13.1/node-v20.13.1-x64.msi" -OutFile $nodeMsi
              Start-Process msiexec.exe -ArgumentList "/i", "`"$nodeMsi`"", "/quiet", "/norestart" -Wait
              $env:Path += ";C:\Program Files\nodejs"
          }

          # 5. Install dependencies & build Next.js
          Write-Host "Installing npm packages..."
          npm install --legacy-peer-deps

          Write-Host "Building production Next.js bundle..."
          npm run build

          # 6. Register & Start Permanent Windows Background Service (Task Scheduler)
          Write-Host "Registering permanent 24/7 Windows Background Task..."
          
          # Stop existing Node processes & tasks
          Unregister-ScheduledTask -TaskName "AIVideoEditor" -Confirm:$false -ErrorAction SilentlyContinue
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $workDir = $env:GITHUB_WORKSPACE
          $runnerBat = Join-Path $workDir "run-server.bat"
          $nodeExe = "C:\Program Files\nodejs\node.exe"
          $nextCli = Join-Path $workDir "node_modules\next\dist\bin\next"

          # Create wrapper script that launches next start on 0.0.0.0:3000
          $batContent = "@echo off`r`nset PORT=3000`r`nset HOSTNAME=0.0.0.0`r`nset NODE_ENV=production`r`n`"$nodeExe`" `"$nextCli`" start -H 0.0.0.0 -p 3000"
          Set-Content -Path $runnerBat -Value $batContent

          # Register Windows Task Scheduler task that runs on boot and persists 24/7
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c `"$runnerBat`"" -WorkingDirectory $workDir
          $trigger = New-ScheduledTaskTrigger -AtStartup
          Register-ScheduledTask -TaskName "AIVideoEditor" -Action $action -Trigger $trigger -User "SYSTEM" -RunLevel Highest -Force
          Start-ScheduledTask -TaskName "AIVideoEditor"

          Start-Sleep -Seconds 5

          Write-Host "Deployment Completed Successfully! Server active on http://0.0.0.0:3000 (Forwarded to 9999 & 8000)"
