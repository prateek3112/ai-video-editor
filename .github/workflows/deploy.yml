name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Install Docker (if missing) & Build Containers
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting AI Video Editor deployment..."

          # 1. Discover Docker paths
          $searchPaths = @(
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\Program Files\Docker\Docker\resources",
              "C:\Program Files\Docker\Docker",
              "C:\Program Files\Docker\Docker\resources\cli-plugins",
              "C:\ProgramData\DockerDesktop\version-cli"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Auto-install Docker Desktop if missing
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
              Write-Host "Docker not detected. Automatically downloading and installing Docker Desktop..."
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $installerPath = "$env:TEMP\DockerInstaller.exe"
              Invoke-WebRequest -Uri "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -OutFile $installerPath
              Write-Host "Installing Docker Desktop silently..."
              Start-Process -FilePath $installerPath -ArgumentList "install", "--quiet", "--accept-license" -Wait
              
              # Add to PATH post-install
              $env:Path += ";C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Docker\Docker"
          }

          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Run Docker Compose
          if (Get-Command docker-compose -ErrorAction SilentlyContinue) {
              docker-compose --env-file .env.production up -d --build
          } elseif (Get-Command docker -ErrorAction SilentlyContinue) {
              docker compose --env-file .env.production up -d --build
          } else {
              Write-Host "Docker command ready. Please start Docker service if prompted."
          }

          Write-Host "Deployment Completed Successfully!"
