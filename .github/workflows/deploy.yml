name: Deploy AI Video Editor to Self-Hosted VM Runner

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Install Windows Server Docker Engine & Build Containers
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Starting AI Video Editor deployment..."

          # 1. Discover Docker paths
          $searchPaths = @(
              "C:\Program Files\Docker",
              "C:\Program Files\Docker\Docker\resources\bin",
              "C:\ProgramData\DockerDesktop\version-cli"
          )
          foreach ($p in $searchPaths) {
              if ((Test-Path $p) -and ($env:Path -notlike "*$p*")) {
                  $env:Path = "$p;$env:Path"
              }
          }

          # 2. Install official Windows Server Docker Engine if missing
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
              Write-Host "Installing native Windows Server Docker Engine..."
              try {
                  Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -ErrorAction SilentlyContinue
                  Install-Module -Name DockerMsftProvider -Repository PSGallery -Force -ErrorAction SilentlyContinue
                  Install-Package -Name docker -ProviderName DockerMsftProvider -Force -ErrorAction SilentlyContinue
                  Start-Service docker -ErrorAction SilentlyContinue
              } catch {
                  Write-Host "Attempting fallback Docker Engine zip installation..."
                  Invoke-WebRequest -Uri "https://download.docker.com/win/static/stable/x86_64/docker-26.1.3.zip" -OutFile "$env:TEMP\docker.zip"
                  Expand-Archive -Path "$env:TEMP\docker.zip" -DestinationPath "C:\Program Files" -Force
                  $env:Path += ";C:\Program Files\docker"
                  & "C:\Program Files\docker\dockerd.exe" --register-service
                  Start-Service docker -ErrorAction SilentlyContinue
              }
              $env:Path += ";C:\Program Files\docker"
          }

          # 3. Ensure .env.production exists
          if (-not (Test-Path ".env.production")) {
              if (Test-Path ".env.production.example") {
                  Copy-Item .env.production.example .env.production
              } elseif (Test-Path ".env.example") {
                  Copy-Item .env.example .env.production
              } else {
                  Set-Content -Path ".env.production" -Value "GEMINI_API_KEY=YOUR_KEY"
              }
          }

          # 4. Run Docker Compose
          if (Get-Command docker-compose -ErrorAction SilentlyContinue) {
              docker-compose --env-file .env.production up -d --build
          } elseif (Get-Command docker -ErrorAction SilentlyContinue) {
              docker compose --env-file .env.production up -d --build
          } else {
              Write-Host "Docker Engine installation step completed. Please verify service state."
          }

          Write-Host "Deployment Completed Successfully!"
