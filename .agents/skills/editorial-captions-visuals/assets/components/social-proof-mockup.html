<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social Proof Mockup Component</title>
  </head>
  <body>
    <template>
      <style>
        :root {
          --social-bg: #ffffff;
          --social-ink: #000000;
          --social-secondary: #737373;
          --social-border: #dbdbdb;
          --social-blue: #0095f6;
          --social-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .social-proof-stage {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          pointer-events: none;
          font-family: var(--social-sans);
        }

        .social-card {
          width: 820px;
          background: var(--social-bg);
          border: 1.5px solid var(--social-border);
          border-radius: 28px;
          padding: 28px 36px;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
          color: var(--social-ink);
        }

        /* Header */
        .social-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-bottom: 20px;
          border-bottom: 1px solid #efefef;
        }
        .social-creator {
          display: flex;
          align-items: center;
          gap: 14px;
        }
        .social-avatar {
          width: 46px;
          height: 46px;
          border-radius: 50%;
          background: #e2e8f0;
          border: 2px solid #ffffff;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .social-username {
          font-weight: 700;
          font-size: 20px;
        }
        .social-badge {
          display: inline-block;
          margin-left: 6px;
          color: var(--social-blue);
          font-size: 16px;
        }

        /* Post Metric Bar */
        .social-insights {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #f8fafc;
          padding: 14px 20px;
          border-radius: 14px;
          margin: 20px 0;
          font-size: 16px;
          font-weight: 600;
          color: var(--social-secondary);
        }
        .social-boost-btn {
          background: var(--social-blue);
          color: #ffffff;
          padding: 8px 18px;
          border-radius: 8px;
          font-weight: 600;
          font-size: 14px;
        }

        /* Engagement Numbers */
        .social-actions {
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 22px;
          font-weight: 700;
          margin-bottom: 18px;
        }
        .social-action-group {
          display: flex;
          align-items: center;
          gap: 22px;
        }

        /* Post Caption Text */
        .social-caption-body {
          font-size: 17px;
          line-height: 1.45;
          margin-bottom: 20px;
        }
        .social-caption-body strong {
          font-weight: 700;
          margin-right: 6px;
        }

        /* Comment Highlight */
        .social-comment-highlight {
          background: #f1f5f9;
          border-left: 4px solid var(--social-blue);
          padding: 14px 18px;
          border-radius: 0 12px 12px 0;
          font-size: 16px;
        }
        .social-comment-highlight strong {
          font-weight: 700;
          margin-right: 8px;
        }
      </style>

      <div
        id="social-mockup-root"
        data-composition-id="social-proof-mockup"
        data-start="0"
        data-duration="6"
        data-width="1080"
        data-height="1920"
        style="position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none"
      >
        <div class="social-proof-stage">
          <div class="social-card" id="social-proof-card">
            <div class="social-header">
              <div class="social-creator">
                <div class="social-avatar"></div>
                <div>
                  <span class="social-username">abigaildaniellla</span>
                  <span class="social-badge">✓</span>
                </div>
              </div>
              <div style="font-size: 24px; color: #737373;">•••</div>
            </div>

            <div class="social-insights">
              <span>👁 119K • View insights</span>
              <span class="social-boost-btn">Boost post</span>
            </div>

            <div class="social-actions">
              <div class="social-action-group">
                <span>❤️ 3,448</span>
                <span>💬 565</span>
                <span>🔄 62</span>
              </div>
              <span>🔖 2,163</span>
            </div>

            <div class="social-caption-body">
              <strong>abigaildaniellla</strong> I've been using this text effect in most of my videos recently, they're attention grabbing which means longer retention...
            </div>

            <div class="social-comment-highlight">
              <strong>jacentwamala</strong> Font?
              <div style="color: #0095f6; font-weight: 600; margin-top: 4px; font-size: 14px;">
                ↳ abigaildaniellla: Acumin Pro (Bold for intros, Regular for body)
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const timeline = gsap.timeline({ paused: true });

          // Reveal Card with subtle spring settle
          timeline.fromTo(
            "#social-proof-card",
            { opacity: 0, y: 40, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
            0.15
          );

          // Card exit
          timeline.to(
            "#social-proof-card",
            { opacity: 0, y: -24, scale: 0.97, duration: 0.35, ease: "power2.in" },
            5.5
          );

          timeline.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines["social-proof-mockup"] = timeline;
        })();
      </script>
    </template>
  </body>
</html>
